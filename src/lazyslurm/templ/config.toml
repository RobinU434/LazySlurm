# LazySlurm configuration
# Uncomment and modify values as needed. See README for full documentation.
#
# All CLI arguments can be set here as defaults.
# CLI arguments always override config file values.

# The LazySlurm release that last wrote this file. Written for you, not by you.
# When a newer release runs, it rewrites the file from its own template --
# keeping every value you set and leaving a copy at config.toml.bak -- so the
# comments here always document the version you are actually running. Set it to
# an older version (or delete the line) to force that rewrite.
config_version = "0.0.0"

# refresh = 5.0              # auto-refresh interval in seconds (0 = off)
# days = 7                   # how many days back for terminated jobs
# user = ""                  # Slurm user to monitor (empty = $USER)
# partition = ""             # filter by partition (empty = all)
# no_gpu = false             # disable GPU monitoring tab
# no_live = false            # disable live CPU/GPU monitoring
# remote = ""                # SSH target for remote mode (e.g. "user@login.hpc.edu")
# editor = "vim"             # text editor for viewing logs and config
# pager = "less"             # pager for browsing whole logs with 'l' ("less", "more", "bat")

# How 'o' opens a shell on a job's compute node. 'O' always uses the other one.
#   ssh  = the machine itself: no CUDA_VISIBLE_DEVICES, all node GPUs visible,
#          nothing capped by the job's limits, but adds no job step
#   srun = inside the allocation: correct GPUs and resource limits, but the
#          step shows up in sacct and lowers the job's reported CPU efficiency
# Use srun if your cluster's pam_slurm_adm refuses ssh to compute nodes.
# interactive_shell = "ssh"  # "ssh" (default) | "srun"

# How the cpu and gpu tabs present themselves. Shift+M cycles the modes at
# runtime; this is only what they start on.
#   text  = the raw ps / nvidia-smi output — the only mode that shows the
#           process list, and nvidia-smi's ECC/MIG sections
#   meter = one bar per allocated core and per GPU, htop/nvtop style
#   graph = the meters plus a history band per metric (default)
# resource_monitor = "graph"

# What Enter unfolds a node row into, in the partition monitor's node view.
#   gpu  = one row per GPU, so you can see *which* device is free; a node with
#          no GRES unfolds its CPU allocation instead (default)
#   cpu  = always the CPU allocation
#   both = a GPU block and a CPU block
#   off  = node rows do not expand
# node_expand = "gpu"

# How that node view's GPUs column reads.
#   count  = 7/8 (default)
#   glyphs = one mark per device, busy or free, so a free slot shows without
#            expanding anything. Falls back to the count past 12 devices.
# gpu_column = "count"

# Column display settings
# max_name_width = 16        # max characters for job name column (0 = unlimited)
# max_partition_width = 16   # max characters for partition column (0 = unlimited)
# abbreviate_states = false  # use short state names: COMP, FAIL, TIME, CAN, OOM, ...
# collapse_arrays = true     # fold a job array into one row; Enter expands it

# What to call this cluster in the on-disk caches. Job ids are per-cluster, so
# job 4815 exists on every one of them and means something different on each;
# the caches keep them apart under this name. Empty asks Slurm (ClusterName),
# falling back to the --remote host, then "local". Set it only if that is wrong.
# cluster_name = ""

# Cache settings
# cache_max_age_days = 30    # auto-delete cached job info older than N days (0 = never)
# script_cache_dir = ""      # where archived sbatch scripts live (default: <config_dir>/scripts)

# Partition display order in the cluster bar.
# Partitions not listed appear after these in their default order.
# Can also be set via: lazyslurm --partition-order gpu,cpu,fat
# partition_order = ["gpu", "cpu", "fat"]

# Custom partition colors in the job tables.
# Overrides the automatic hash-based coloring.
# Valid color names: cyan, magenta, yellow, green, blue, red,
# bright_cyan, bright_magenta, bright_green, white, dim, bold,
# or any Rich color (e.g. "dark_orange", "grey50").
# [partition_colors]
# gpu = "green"
# cpu = "cyan"
# fat = "magenta"
# debug = "dim"
