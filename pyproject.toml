[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "lazyslurm-rs"
description = "A TUI for monitoring Slurm HPC jobs (Rust implementation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["slurm", "hpc", "tui", "monitoring", "jobs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
]
# The version is single-sourced from Cargo.toml.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/RobinU434/LazySlurm"
Repository = "https://github.com/RobinU434/LazySlurm"

[tool.maturin]
# The wheel ships a compiled binary, not a Python module: no PyO3, no Python
# source, no import machinery. `pip install` simply drops `lazyslurm` on PATH.
bindings = "bin"
strip = true
