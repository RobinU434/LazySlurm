[project]
name = "lazyslurm-py"
dynamic = ["version"]
description = "A TUI for monitoring Slurm HPC jobs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["slurm", "hpc", "tui", "monitoring", "jobs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
]
dependencies = [
    "textual>=0.86",
    # Writing config.toml has to preserve the template's comments; tomllib and
    # a hand-rolled serialiser both destroy them.
    "tomlkit>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
lazyslurm = "lazyslurm.__main__:main"

[tool.hatch.version]
# Single source of truth: the packaged __version__, so the distribution version
# and lazyslurm.__version__ cannot drift apart.
path = "src/lazyslurm/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyslurm"]

[tool.hatch.build.targets.sdist]
# Ship the project, not the working directory: local tool settings and caches
# carry absolute home paths and are of no use to anyone installing the package.
include = [
    "src/lazyslurm",
    "tests",
    "img",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
