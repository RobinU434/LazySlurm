[package]
name = "lazyslurm"
version = "0.1.0"
edition = "2021"
# Only relevant when building from the sdist; wheels ship a compiled binary.
rust-version = "1.88"
description = "A TUI for monitoring Slurm HPC jobs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RobinU434/LazySlurm"
keywords = ["slurm", "hpc", "tui", "monitoring", "jobs"]
categories = ["command-line-utilities"]

[[bin]]
name = "lazyslurm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
nix = { version = "0.31.3", features = ["term", "process", "fs", "signal"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
    "io-util",
    "fs",
] }
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
